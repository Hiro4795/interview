<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>입구 입실 확인</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial;
  background:#f4f6f8;
  margin:0;
  padding:20px;
}
h1{font-size:30px;margin-bottom:10px;}
#camera{
  width:100%;
  max-width:480px;
  margin:10px 0;
  border-radius:8px;
  overflow:hidden;
}
input{
  font-size:22px;
  width:100%;
  padding:12px;
  margin-top:10px;
}
.box{
  margin-top:15px;
  padding:15px;
  background:#fff;
  border-radius:8px;
}
.ok{border-left:8px solid #2ecc71;background:#e8f7ec;}
.no{border-left:8px solid #e74c3c;background:#fdecea;}
.warn{border-left:8px solid #f39c12;background:#fff4e5;}
.big{font-size:24px;font-weight:bold;margin-bottom:8px;}
button{
  font-size:20px;
  padding:8px 16px;
  margin-top:10px;
}
</style>
</head>
<body>

<h1>입구 입실 확인</h1>

<div id="camera"></div>
<input id="manual" placeholder="수험번호 직접 입력 후 Enter" autocomplete="off">
<div id="result" class="box" style="display:none;"></div>

<!-- 🔥 Quagga -->
<script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.js"></script>

<!-- 🔥 Firebase SDK (반드시 먼저 로드) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ========================= */
/* Firebase 초기화 */
/* ========================= */
const firebaseConfig = {
  apiKey: "AIzaSyC0vy7CRKb0eCe3uflueVjVZmBbJjiL8Eo",
  authDomain: "shucall1.firebaseapp.com",
  projectId: "shucall1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ========================= */

const manual = document.getElementById("manual");
const result = document.getElementById("result");
const ALLOW_MINUTES = 10;

/* ========================= */
/* 🔥 입력창 포커스 완전 고정 */
/* ========================= */
function forceFocus(){
  if(document.activeElement !== manual){
    manual.focus();
  }
}
window.onload = ()=> manual.focus();
document.addEventListener("click", forceFocus);
setInterval(forceFocus, 300);

/* ========================= */
/* 🔥 대문자 강제 */
/* ========================= */
manual.addEventListener("input", ()=>{
  manual.value = manual.value.toUpperCase();
});

/* ========================= */
/* 스캔 공통 처리 */
/* ========================= */
async function handleScan(code){

  code = code.trim().toUpperCase();
  if(!code) return;

  result.style.display="block";
  result.className="box";
  result.innerHTML="조회 중...";

  try{
    const ref = db.collection("applicants").doc(code);
    const doc = await ref.get();

    if(!doc.exists){
      showNo("등록되지 않은 수험번호");
      restartCamera();
      return;
    }

    const data = doc.data();

    if(data.status !== "NOT_ENTERED"){
      showWarn("이미 입실 처리됨",
        `면접실: ${data.interviewRoom}<br>가번호: ${data.tempNumber}`);
      restartCamera();
      return;
    }

    const now = new Date();
    const [h,m] = data.interviewTime.split(":").map(Number);
    const interviewTime = new Date();
    interviewTime.setHours(h,m,0,0);
    const allowTime = new Date(interviewTime.getTime() - ALLOW_MINUTES*60000);

    if(now < allowTime){
      showNo("아직 입실 불가",
        `면접시간: ${data.interviewTime}<br>
         입실 가능: ${allowTime.toLocaleTimeString()}`);
      restartCamera();
      return;
    }

    result.className="box ok";
    result.innerHTML=`
      <div class="big">✔ 입실 가능</div>
      <p>이름: ${data.name}</p>
      <p>면접실: ${data.interviewRoom}</p>
      <p>가번호: ${data.tempNumber}</p>
      <button onclick="checkIn('${code}')">입실 처리 완료</button>
    `;

  }catch(e){
    console.error(e);
    alert(e.message);
  }
}

/* ========================= */
/* 입실 처리 */
/* ========================= */
async function checkIn(code){
  await db.collection("applicants").doc(code).update({
    status:"CHECKED_IN",
    checkInAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  result.className="box ok";
  result.innerHTML=`
    <div class="big">✔ 입실 처리 완료</div>
    <p>대기실로 안내하세요</p>
  `;

  setTimeout(()=>restartCamera(),1500);
}

/* ========================= */
function showNo(title,detail=""){
  result.className="box no";
  result.innerHTML=`<div class="big">❌ ${title}</div><p>${detail}</p>`;
}
function showWarn(title,detail=""){
  result.className="box warn";
  result.innerHTML=`<div class="big">⚠ ${title}</div><p>${detail}</p>`;
}

/* ========================= */
/* 수동 입력 */
/* ========================= */
manual.addEventListener("keydown",(e)=>{
  if(e.key==="Enter"){
    const code=manual.value;
    manual.value="";
    Quagga.stop();
    handleScan(code);
  }
});

/* ========================= */
/* 카메라 */
/* ========================= */
function startCamera(){
  Quagga.init({
    inputStream:{
      type:"LiveStream",
      target:document.querySelector("#camera"),
      constraints:{facingMode:"environment"}
    },
    decoder:{
      readers:["code_128_reader","code_39_reader"]
    }
  },(err)=>{
    if(!err) Quagga.start();
  });

  Quagga.onDetected(onDetectedOnce);
}

function onDetectedOnce(res){
  const code=res.codeResult.code.toUpperCase();
  Quagga.offDetected(onDetectedOnce);
  Quagga.stop();
  handleScan(code);
}

function restartCamera(){
  setTimeout(()=>{
    result.style.display="none";
    startCamera();
    manual.focus();
  },1000);
}

startCamera();
</script>

</body>
</html>
