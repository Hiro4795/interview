<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>면접 호출 전광판</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  position:relative;
}

h1{
  font-size:40px;
  margin-bottom:40px;
}

#numbers{
  font-size:100px;
  font-weight:bold;
  letter-spacing:20px;
}

#unlockBtn{
  position:absolute;
  top:20px;
  right:20px;
  padding:10px 15px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:6px;
}
</style>
</head>
<body>

<h1 id="roomTitle">면접실 호출 현황</h1>
<div id="numbers">-</div>

<button id="unlockBtn">🔊 알림음 활성화</button>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* ============================= */
/* Firebase 초기화 */
/* ============================= */
const firebaseConfig = {
  apiKey: "AIzaSyC0vy7CRKb0eCe3uflueVjVZmBbJjiL8Eo",
  authDomain: "shucall1.firebaseapp.com",
  projectId: "shucall1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ============================= */
/* 면접실 구분 */
/* ============================= */
const params = new URLSearchParams(window.location.search);
const room = params.get("room") || "면접실1";
document.getElementById("roomTitle").innerText = room + " 호출 현황";

/* ============================= */
/* 🔊 알림음 설정 */
/* ============================= */
const audio = new Audio("ding.mp3");
audio.preload = "auto";

let audioUnlocked = false;
const unlockBtn = document.getElementById("unlockBtn");

unlockBtn.addEventListener("click", () => {
  audio.play().then(()=>{
    audio.pause();
    audio.currentTime = 0;
    audioUnlocked = true;
    unlockBtn.innerText = "✅ 알림음 활성화됨";
    unlockBtn.style.background = "#2ecc71";
  }).catch(()=>{});
});

/* ============================= */
/* 호출 감지 */
/* ============================= */
let previousNumbers = [];

db.collection("queue").doc(room)
  .onSnapshot(doc => {

    const data = doc.data();
    const numbers = data?.numbers || [];

    // 🔔 새 번호가 추가되었을 때만 소리
    if(numbers.length > previousNumbers.length){
      if(audioUnlocked){
        audio.currentTime = 0;
        audio.play().catch(()=>{});
      }
    }

    previousNumbers = [...numbers];

    render(numbers);
  });

/* ============================= */
/* 화면 표시 */
/* ============================= */
function render(numbers){
  const el = document.getElementById("numbers");

  if(numbers.length === 0){
    el.innerText = "-";
  }else{
    el.innerText = numbers.join("   ");
  }
}
</script>

</body>
</html>
