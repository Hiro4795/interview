<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>면접 호출 화면</title>
<style>
body{background:#000;color:#fff;text-align:center;font-family:Arial;}
#numbers{font-size:120px;margin-top:100px;}
</style>
</head>

<body>

<h1>면접실1</h1>
<div id="numbers">-</div>

<audio id="sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0vy7CRKb0eCe3uflueVjVZmBbJjiL8Eo",
  authDomain: "shucall1.firebaseapp.com",
  projectId: "shucall1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const room="면접실1";
const numbersEl=document.getElementById("numbers");
const sound=document.getElementById("sound");

let lastLength=0;

db.collection("queue").doc(room)
.onSnapshot(doc=>{
  if(!doc.exists)return;

  const numbers=doc.data().numbers||[];

  if(numbers.length>0){
    numbersEl.innerText=numbers.join("   ");
  }else{
    numbersEl.innerText="-";
  }

  if(numbers.length>lastLength){
    sound.play();
  }

  lastLength=numbers.length;
});
</script>

</body>
</html>
