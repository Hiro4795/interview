<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>면접 호출 화면</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial;
  text-align:center;
}

h1{
  margin-top:40px;
  font-size:40px;
}

#numbers{
  margin-top:80px;
  font-size:120px;
  letter-spacing:20px;
}
</style>
</head>

<body>

<h1 id="roomTitle">면접실</h1>
<div id="numbers">-</div>

<audio id="callSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0vy7CRKb0eCe3uflueVjVZmBbJjiL8Eo",
  authDomain: "shucall1.firebaseapp.com",
  projectId: "shucall1",
  storageBucket: "shucall1.firebasestorage.app",
  messagingSenderId: "493600891772",
  appId: "1:493600891772:web:84ced7c30f7a0dd48e3af9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const urlParams = new URLSearchParams(window.location.search);
const room = urlParams.get("room") || "A";

document.getElementById("roomTitle").textContent = "면접실 " + room;

const numbersEl = document.getElementById("numbers");
const sound = document.getElementById("callSound");

let lastNumbers = [];

db.collection("queue").doc(room)
  .onSnapshot(doc=>{
    if(!doc.exists) return;

    const data = doc.data();
    const numbers = data.numbers || [];

    numbersEl.textContent = numbers.join("  ");

    // 새 번호 추가 시 1회 호출음
    if(numbers.length > lastNumbers.length){
      sound.play();
    }

    lastNumbers = numbers;
  });
</script>

</body>
</html>
