<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>면접 호출 화면</title>
<style>
body{
  background:#000;
  color:#fff;
  text-align:center;
  font-family:Arial;
}
#number{
  font-size:150px;
  margin-top:120px;
}
</style>
</head>

<body>

<h1 id="roomTitle"></h1>
<div id="number">-</div>

<audio id="sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0vy7CRKb0eCe3uflueVjVZmBbJjiL8Eo",
  authDomain: "shucall1.firebaseapp.com",
  projectId: "shucall1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const urlParams = new URLSearchParams(window.location.search);
const room = urlParams.get("room") || "면접실1";

document.getElementById("roomTitle").innerText = room;

const numberEl = document.getElementById("number");
const sound = document.getElementById("sound");

let lastNumber=null;

db.collection("queue").doc(room)
.onSnapshot(doc=>{
  if(!doc.exists) return;

  const data = doc.data();
  const current = data.current;

  if(current){
    numberEl.innerText=current;

    if(current!==lastNumber){
      sound.play();
    }
  }else{
    numberEl.innerText="-";
  }

  lastNumber=current;
});
</script>

</body>
</html>
