};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* 호출 */
async function callNumber(examNo, tempNumber, room){

  // 현재 호출번호 설정
  await db.collection("queue").doc(room).set({
    current: tempNumber
  });

  // CALLED 상태 변경
  await db.collection("applicants").doc(examNo).update({
    status:"CALLED"
  });
}

/* 호출 취소 */
async function cancelCall(examNo, tempNumber, room){

  // display 제거
  await db.collection("queue").doc(room).set({
    current: null
  });

  // 다시 WAITING 복귀
  await db.collection("applicants").doc(examNo).update({
    status:"WAITING"
  });
}

/* 입실 완료 */
async function completeEntry(examNo, room){

  await db.collection("queue").doc(room).set({
    current: null
  });

  await db.collection("applicants").doc(examNo).update({
    status:"COMPLETED"
  });
}
</script>
