<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>대기실 입실 확인 (Admin)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; padding:20px; background:#f4f6f8; }
h1 { margin-bottom:20px; }

#scannerInput {
  font-size:26px;
  padding:14px;
  width:100%;
  border:3px solid #333;
  border-radius:6px;
}

.infoBox {
  background:#fff;
  padding:20px;
  margin-top:15px;
  border-radius:8px;
}

.waiting { margin-top:30px; }

.roomSection {
  margin-bottom:25px;
}

.roomSection h3 {
  margin-bottom:10px;
}

.roomSection button {
  font-size:22px;
  padding:10px 16px;
  margin:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>대기실 입실 확인 (Admin)</h1>

<input id="scannerInput" placeholder="바코드를 스캔하세요" autocomplete="off">

<div class="infoBox">
  <div>수험번호: <span id="examNo">-</span></div>
  <div>이름: <span id="name">-</span></div>
  <div>가번호: <span id="tempNumber">-</span></div>
  <div>면접실: <span id="room">-</span></div>
</div>

<div class="waiting">
  <h2>대기 중 가번호</h2>

  <div class="roomSection">
    <h3>면접실 A</h3>
    <div id="waitingA"></div>
  </div>

  <div class="roomSection">
    <h3>면접실 B</h3>
    <div id="waitingB"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0vy7CRKb0eCe3uflueVjVZmBbJjiL8Eo",
  authDomain: "shucall1.firebaseapp.com",
  projectId: "shucall1",
  storageBucket: "shucall1.firebasestorage.app",
  messagingSenderId: "493600891772",
  appId: "1:493600891772:web:84ced7c30f7a0dd48e3af9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const examNoEl = document.getElementById("examNo");
const nameEl = document.getElementById("name");
const tempEl = document.getElementById("tempNumber");
const roomEl = document.getElementById("room");
const scannerInput = document.getElementById("scannerInput");
const waitingA = document.getElementById("waitingA");
const waitingB = document.getElementById("waitingB");

function keepFocus(){ scannerInput.focus(); }
keepFocus();
document.addEventListener("click", keepFocus);
setInterval(keepFocus, 500);

scannerInput.addEventListener("keydown", async (e)=>{
  if(e.key !== "Enter") return;

  const code = scannerInput.value.trim().toUpperCase();
  scannerInput.value = "";
  if(!code) return;

  handleScan(code);
});

async function handleScan(examNo){
  try{
    const ref = db.collection("applicants").doc(examNo);
    const doc = await ref.get();

    if(!doc.exists){
      alert("등록되지 않은 수험번호");
      return;
    }

    const data = doc.data();

    if(data.status !== "CHECKED_IN"){
      alert("입구 체크인 후 입실 가능");
      return;
    }

    examNoEl.textContent = examNo;
    nameEl.textContent = data.name;
    tempEl.textContent = data.tempNumber;
    roomEl.textContent = data.interviewRoom;

    await ref.update({
      status: "WAITING",
      waitingAt: firebase.firestore.FieldValue.serverTimestamp()
    });

  }catch(e){
    alert(e.message);
  }
}

/* WAITING 목록 */
db.collection("applicants")
  .where("status","==","WAITING")
  .onSnapshot(snapshot=>{
    waitingA.innerHTML="";
    waitingB.innerHTML="";

    snapshot.forEach(doc=>{
      const d = doc.data();
      const btn = document.createElement("button");
      btn.textContent = d.tempNumber;

      btn.onclick = ()=> callNumber(doc.id, d.tempNumber, d.interviewRoom);

      if(d.interviewRoom === "A"){
        waitingA.appendChild(btn);
      }else{
        waitingB.appendChild(btn);
      }
    });
  });

/* 호출 */
async function callNumber(examNo, tempNumber, room){

  // queue에 추가
  await db.collection("queue").doc(room).set({
    numbers: firebase.firestore.FieldValue.arrayUnion(tempNumber),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge:true});

  // CALLED 처리 → 자동 목록 제거
  await db.collection("applicants").doc(examNo).update({
    status:"CALLED"
  });
}
</script>

</body>
</html>
