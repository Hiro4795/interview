<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>대기실 Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;padding:20px;background:#f4f6f8;}
h1{margin-bottom:15px;}

#statsPanel{
  display:flex;
  gap:20px;
  margin-bottom:25px;
  font-size:16px;
}

#scannerInput{
  font-size:20px;
  padding:10px;
  width:100%;
  border:3px solid #333;
  border-radius:6px;
  margin-bottom:25px;
}

.container{display:flex;gap:40px;}
.box{flex:1;background:#fff;padding:15px;border-radius:8px;}
h2{text-align:center;}

.number{
  font-size:18px;
  padding:6px 10px;
  margin:6px;
  cursor:pointer;
  display:inline-block;
  background:#e3e3e3;
  border-radius:6px;
}

button{
  margin-top:20px;
  padding:8px 14px;
  font-size:15px;
}
</style>
</head>

<body>

<h1 id="title"></h1>

<div id="statsPanel">
  <div>체크인: <span id="statCheckin">0</span></div>
  <div>대기중: <span id="statWaiting">0</span></div>
  <div>호출완료: <span id="statCalled">0</span></div>
  <div>면접완료: <span id="statCompleted">0</span></div>
</div>

<input id="scannerInput" placeholder="바코드를 스캔하세요" autocomplete="off">

<div class="container">
  <div class="box">
    <h2>호출 전</h2>
    <div id="waitingList"></div>
  </div>

  <div class="box">
    <h2>호출 완료</h2>
    <div id="calledList"></div>
  </div>
</div>

<button onclick="completeAll()">이동완료</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0vy7CRKb0eCe3uflueVjVZmBbJjiL8Eo",
  authDomain: "shucall1.firebaseapp.com",
  projectId: "shucall1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* 🔹 URL로 방 구분 */
const urlParams = new URLSearchParams(window.location.search);
const room = urlParams.get("room") || "면접실1";
document.getElementById("title").innerText = "대기실 관리 ("+room+")";

const scannerInput = document.getElementById("scannerInput");
const waitingDiv = document.getElementById("waitingList");
const calledDiv = document.getElementById("calledList");

const statCheckin = document.getElementById("statCheckin");
const statWaiting = document.getElementById("statWaiting");
const statCalled = document.getElementById("statCalled");
const statCompleted = document.getElementById("statCompleted");

/* 🔒 스캐너 포커스 유지 */
function keepFocus(){ scannerInput.focus(); }
keepFocus();
document.addEventListener("click", keepFocus);
setInterval(keepFocus, 500);

/* 🔹 스캔 처리 */
scannerInput.addEventListener("keydown", async (e)=>{
  if(e.key !== "Enter") return;

  const code = scannerInput.value.trim().toUpperCase();
  scannerInput.value = "";
  if(!code) return;

  try{
    const ref = db.collection("applicants").doc(code);
    const doc = await ref.get();

    if(!doc.exists){
      alert("없는 수험번호");
      return;
    }

    if(doc.data().status !== "CHECKED_IN"){
      alert("CHECKED_IN 상태만 입실 가능");
      return;
    }

    await ref.update({
      status:"WAITING",
      waitingAt:firebase.firestore.FieldValue.serverTimestamp()
    });

  }catch(err){
    alert("스캔 오류: "+err.message);
  }
});

/* 🔹 통계 */
db.collection("applicants")
.where("interviewRoom","==",room)
.onSnapshot(snapshot=>{

  let checkin=0, waiting=0, called=0, completed=0;

  snapshot.forEach(doc=>{
    const status=doc.data().status;
    if(status==="CHECKED_IN") checkin++;
    if(status==="WAITING") waiting++;
    if(status==="CALLED") called++;
    if(status==="COMPLETED") completed++;
  });

  statCheckin.innerText=checkin;
  statWaiting.innerText=waiting;
  statCalled.innerText=called;
  statCompleted.innerText=completed;
});

/* 🔹 WAITING 목록 */
db.collection("applicants")
.where("status","==","WAITING")
.where("interviewRoom","==",room)
.onSnapshot(snapshot=>{

  waitingDiv.innerHTML="";
  let list=[];
  snapshot.forEach(doc=> list.push({id:doc.id,...doc.data()}));

  list.sort((a,b)=>Number(a.tempNumber)-Number(b.tempNumber));

  list.forEach(d=>{
    const span=document.createElement("span");
    span.className="number";
    span.innerText=d.tempNumber;
    span.onclick=()=>callNumber(d.id,d.tempNumber);
    waitingDiv.appendChild(span);
  });
});

/* 🔹 CALLED 목록 */
db.collection("applicants")
.where("status","==","CALLED")
.where("interviewRoom","==",room)
.onSnapshot(snapshot=>{

  calledDiv.innerHTML="";
  let list=[];
  snapshot.forEach(doc=> list.push({id:doc.id,...doc.data()}));

  list.sort((a,b)=>Number(a.tempNumber)-Number(b.tempNumber));

  list.forEach(d=>{
    const span=document.createElement("span");
    span.className="number";
    span.innerText=d.tempNumber;
    span.onclick=()=>cancelCall(d.id,d.tempNumber);
    calledDiv.appendChild(span);
  });
});

/* 🔹 호출 */
async function callNumber(examNo,tempNumber){
  await db.collection("applicants").doc(examNo).update({
    status:"CALLED"
  });

  await db.collection("queue").doc(room).set({
    numbers: firebase.firestore.FieldValue.arrayUnion(tempNumber)
  },{merge:true});
}

/* 🔹 취소 */
async function cancelCall(examNo,tempNumber){
  await db.collection("applicants").doc(examNo).update({
    status:"WAITING"
  });

  await db.collection("queue").doc(room).update({
    numbers: firebase.firestore.FieldValue.arrayRemove(tempNumber)
  });
}

/* 🔹 이동완료 */
async function completeAll(){

  const snapshot = await db.collection("applicants")
  .where("status","==","CALLED")
  .where("interviewRoom","==",room)
  .get();

  snapshot.forEach(doc=>{
    db.collection("applicants").doc(doc.id).update({
      status:"COMPLETED"
    });
  });

  await db.collection("queue").doc(room).set({
    numbers:[]
  });
}
</script>

</body>
</html>
