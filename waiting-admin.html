<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>대기실 입실 확인 (Admin)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

h1 { margin-bottom: 20px; }

.container {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}

.infoBox {
  background: #fff;
  padding: 20px;
  border-radius: 8px;
}

.infoBox label {
  font-weight: bold;
}

.infoBox div {
  font-size: 22px;
  margin-bottom: 15px;
}

/* 바코드 입력창 */
#scannerInput {
  font-size: 26px;
  padding: 14px;
  width: 100%;
  box-sizing: border-box;
  border: 3px solid #333;
  border-radius: 6px;
  margin-bottom: 20px;
}

/* 대기 가번호 */
.waiting {
  margin-top: 30px;
}

.waiting button {
  font-size: 22px;
  padding: 10px 16px;
  margin: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>대기실 입실 확인 (Admin)</h1>

<div class="container">

  <!-- 바코드 입력 -->
  <input
    id="scannerInput"
    placeholder="바코드를 스캔하세요"
    autocomplete="off"
  >

  <!-- 수험생 정보 -->
  <div class="infoBox">
    <div><label>수험번호:</label> <span id="examNo">-</span></div>
    <div><label>이름:</label> <span id="name">-</span></div>
    <div><label>가번호:</label> <span id="tempNumber">-</span></div>
  </div>

</div>

<div class="waiting">
  <h2>대기 중 가번호</h2>
  <div id="waitingList"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
console.log("waiting-admin JS loaded");

/* 🔧 Firebase 설정 (여기에 실제 값 입력) */
const firebaseConfig = {
  apiKey: "AIzaSyC0vy7CRKb0eCe3uflueVjVZmBbJjiL8Eo",
  authDomain: "shucall1.firebaseapp.com",
  projectId: "shucall1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* UI 요소 */
const examNoEl = document.getElementById("examNo");
const nameEl = document.getElementById("name");
const tempEl = document.getElementById("tempNumber");
const waitingList = document.getElementById("waitingList");
const scannerInput = document.getElementById("scannerInput");

/* 🔒 항상 포커스 유지 (현장 안정성 핵심) */
function keepFocus() {
  scannerInput.focus();
}
keepFocus();
document.addEventListener("click", keepFocus);
setInterval(keepFocus, 500);

/* ⌨️ USB 바코드 스캐너 입력 처리 */
scannerInput.addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;

  const code = scannerInput.value
    .replace(/\uFEFF/g, "")
    .trim()
    .toUpperCase();  // ⭐ 대문자 변환

  scannerInput.value = "";

  if (!code) return;

  console.log("SCANNED:", code);
  handleScan(code);
});

/* 🔎 스캔 처리 */
async function handleScan(examNo) {
  try {
    const ref = db.collection("applicants").doc(examNo);
    const doc = await ref.get();

    if (!doc.exists) {
      alert("등록되지 않은 수험번호입니다.");
      return;
    }

    const data = doc.data();

    if (data.status === "WAITING") {
      alert("이미 대기 처리된 수험생입니다.");
      return;
    }

    if (data.status !== "CHECKED_IN") {
      alert("입구 체크인 후 대기실 입실이 가능합니다.");
      return;
    }

    // 화면 표시
    examNoEl.textContent = examNo;
    nameEl.textContent = data.name;
    tempEl.textContent = data.tempNumber;

    // WAITING 처리
    await ref.update({
      status: "WAITING",
      waitingAt: firebase.firestore.FieldValue.serverTimestamp()
    });

  } catch (e) {
    console.error("🔥 ERROR:", e);
    alert(e.message);
  }
}

/* 📋 WAITING 목록 실시간 표시 */
db.collection("applicants")
  .where("status", "==", "WAITING")
  .orderBy("waitingAt")
  .onSnapshot(snapshot => {
    waitingList.innerHTML = "";
    snapshot.forEach(doc => {
      const d = doc.data();
      const btn = document.createElement("button");
      btn.textContent = d.tempNumber;
      btn.onclick = () => callNumber(d.tempNumber);
      waitingList.appendChild(btn);
    });
  });

/* 🔔 호출 */
function callNumber(num) {
  db.collection("queue").doc("current").set({
    numbers: firebase.firestore.FieldValue.arrayUnion(num),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });
}
</script>

</body>
</html>
