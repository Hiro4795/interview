<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>대기실 입실 확인 (Admin)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

h1 { margin-bottom: 20px; }

.container {
  display: grid;
  grid-template-columns: 420px 1fr;
  gap: 30px;
}

/* 왼쪽 카메라 */
#cameraBox {
  background: #000;
  height: 360px;
  border-radius: 8px;
}

/* 오른쪽 정보 */
.infoBox {
  background: #fff;
  padding: 20px;
  border-radius: 8px;
}

.infoBox label {
  font-weight: bold;
}

.infoBox div {
  font-size: 22px;
  margin-bottom: 15px;
}

/* 대기 가번호 */
.waiting {
  margin-top: 30px;
}

.waiting button {
  font-size: 22px;
  padding: 10px 16px;
  margin: 6px;
  cursor: pointer;
}

/* 숨김 입력 (USB 스캐너용) */
#scannerInput {
  position: absolute;
  left: -9999px;
}
</style>
</head>

<body>

<h1>대기실 입실 확인 (Admin)</h1>

<div class="container">
  <!-- 왼쪽 -->
  <div id="cameraBox"></div>

  <!-- 오른쪽 -->
  <div class="infoBox">
    <div><label>수험번호:</label> <span id="examNo">-</span></div>
    <div><label>이름:</label> <span id="name">-</span></div>
    <div><label>가번호:</label> <span id="tempNumber">-</span></div>
  </div>
</div>

<div class="waiting">
  <h2>대기 중 가번호</h2>
  <div id="waitingList"></div>
</div>

<!-- USB 바코드 스캐너 입력용 -->
<input id="scannerInput" autocomplete="off">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
/* 🔧 Firebase 설정 */
const firebaseConfig = {
  apiKey: "본인_API_KEY",
  authDomain: "본인_AUTH_DOMAIN",
  projectId: "본인_PROJECT_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* UI 요소 */
const examNoEl = document.getElementById("examNo");
const nameEl = document.getElementById("name");
const tempEl = document.getElementById("tempNumber");
const waitingList = document.getElementById("waitingList");
const scannerInput = document.getElementById("scannerInput");

/* 항상 스캐너 포커스 유지 */
function focusScanner() { scannerInput.focus(); }
focusScanner();
document.addEventListener("click", focusScanner);

/* USB 스캐너 입력 처리 */
scannerInput.addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;

  const code = scannerInput.value.trim();
  scannerInput.value = "";
  if (!code) return;

  handleScan(code);
});

/* 스캔 처리 */
async function handleScan(examNo) {
  const ref = db.collection("applicants").doc(examNo);
  const doc = await ref.get();

  if (!doc.exists) {
    alert("등록되지 않은 수험번호");
    return;
  }

  const data = doc.data();

  if (data.status !== "CHECKED_IN") {
    alert("입구 체크인 후 대기실 입실 가능");
    return;
  }

  // 화면 표시
  examNoEl.textContent = examNo;
  nameEl.textContent = data.name;
  tempEl.textContent = data.tempNumber;

  // WAITING 처리
  await ref.update({
    status: "WAITING",
    waitingAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

/* WAITING 목록 실시간 표시 */
db.collection("applicants")
  .where("status", "==", "WAITING")
  .orderBy("waitingAt")
  .onSnapshot(snapshot => {
    waitingList.innerHTML = "";
    snapshot.forEach(doc => {
      const d = doc.data();
      const btn = document.createElement("button");
      btn.textContent = d.tempNumber;
      btn.onclick = () => callNumber(d.tempNumber);
      waitingList.appendChild(btn);
    });
  });

/* 호출 */
function callNumber(num) {
  db.collection("queue").doc("current").set({
    numbers: firebase.firestore.FieldValue.arrayUnion(num),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });
}
</script>

</body>
</html>
